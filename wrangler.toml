name = "demo-sites-cloudflare"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "demo01-sites-db"
database_id = "1d782002-7b87-4975-bef1-797997cde8a0"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "demo01-sites-files"

[triggers]
# 每12小时执行一次（UTC）
crons = ["0 */12 * * *"]

[vars]
ENVIRONMENT = "production"
